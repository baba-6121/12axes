services:
  - type: web
    name: 12axes-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FRONTEND_ORIGINS
        value: https://12axes.lol,https://12axes-app.pages.dev,https://12axes.vercel.app,https://12axes.enzoxavier.com.br,http://localhost:5173,http://127.0.0.1:5173
      - key: API_ORIGIN_ENFORCEMENT
        value: "true"
